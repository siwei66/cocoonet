# User note:
# Keep this filename and the pypi environment aligned with PyPI's Trusted Publisher configuration.
# Do not change the file name as it is fixed on PyPI.
# Do not change workflow file name on GitHub, delete and recreate it to rename to rebuild links.

name: Build and Release

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  release-build:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Verify release version
        id: version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        shell: python
        run: |
          import os
          import tomllib
          from pathlib import Path

          version = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))["project"]["version"]
          tag = os.environ["RELEASE_TAG"]
          if tag not in (version, f"v{version}"):
              raise SystemExit(f"Release tag {tag!r} must match package version {version!r} or 'v{version}'.")
          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as output:
              output.write(f"version={version}\n")

      # Build into runner storage so existing repository artifacts cannot be published.
      - name: Build and check release distributions
        run: |
          python -m pip install build twine
          python -m build --outdir "$RUNNER_TEMP/release-dists"
          python -m twine check --strict "$RUNNER_TEMP/release-dists"/*
          python -m pip install "$RUNNER_TEMP/release-dists"/*.whl

      - name: Verify installed package version
        working-directory: ${{ runner.temp }}
        env:
          EXPECTED_VERSION: ${{ steps.version.outputs.version }}
        shell: python
        run: |
          import os

          from cocoonet import get_version

          actual = get_version()
          expected = os.environ["EXPECTED_VERSION"]
          if actual != expected:
              raise SystemExit(f"Installed Cocoonet version {actual!r} does not match {expected!r}.")

      - name: Upload verified distributions
        uses: actions/upload-artifact@v7
        with:
          name: release-dists
          path: ${{ runner.temp }}/release-dists/
          if-no-files-found: error

  pypi-publish:
    runs-on: ubuntu-24.04
    needs: release-build
    permissions:
      id-token: write

    environment:
      name: pypi
      url: https://pypi.org/project/cocoonet/

    steps:
      - name: Retrieve release distributions
        uses: actions/download-artifact@v8
        with:
          name: release-dists
          path: dist/

      - name: Publish release distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
