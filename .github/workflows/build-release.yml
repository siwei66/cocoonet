# Keep this filename aligned with the PyPI trusted-publisher configuration.
name: Build and Release

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  checks:
    uses: ./.github/workflows/tests.yml

  release-build:
    needs: checks
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip

      - name: Verify release tag matches package version
        shell: python
        run: |
          import os
          import tomllib
          from pathlib import Path

          version = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))["project"]["version"]
          tag = os.environ["RELEASE_TAG"]
          if tag not in (version, f"v{version}"):
              raise SystemExit(f"Release tag {tag!r} does not match package version {version!r}.")

      - name: Build and validate release distributions
        run: |
          python -m pip install build twine
          python -m build --outdir "$RUNNER_TEMP/release-dists"
          python -m twine check --strict "$RUNNER_TEMP/release-dists/"*
          python -m pip install "$RUNNER_TEMP/release-dists/"*.whl

      - name: Verify installed wheel
        working-directory: ${{ runner.temp }}
        shell: python
        run: |
          import os

          from cocoonet import get_version

          expected = os.environ["RELEASE_TAG"].removeprefix("v")
          actual = get_version()
          if actual != expected:
              raise SystemExit(f"Installed wheel version {actual!r} does not match {expected!r}.")

      - name: Upload validated distributions
        uses: actions/upload-artifact@v7
        with:
          name: release-dists
          path: ${{ runner.temp }}/release-dists/
          if-no-files-found: error

  pypi-publish:
    needs: release-build
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    environment:
      name: pypi
      url: https://pypi.org/project/cocoonet/

    steps:
      - name: Retrieve validated distributions
        uses: actions/download-artifact@v8
        with:
          name: release-dists
          path: dist/

      - name: Publish release distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
