[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "cocoonet"
version = "0.0.0"
description = "Scientific evaluation of machine learning models with local and distributed workers."
readme = "README.md"
# Extend the ceiling and tool targets when the next stable Python series is supported.
requires-python = ">=3.12,<3.15"
authors = [
    {name = "Siwei Luo", email = "siwei1102@outlook.de"}
]
keywords = [
    "machine-learning",
    "model-evaluation",
    "applied-machine-learning",
    "scientific-computing",
    "distributed-computing"
]
classifiers = [
    "Development Status :: 1 - Planning",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: System :: Distributed Computing"
]
dependencies = [
    "aiofiles>=25.1,<26",
    "dill>=0.4,<1",
]

[project.urls]
Homepage = "https://github.com/siwei66/cocoonet"
Repository = "https://github.com/siwei66/cocoonet"
Issues = "https://github.com/siwei66/cocoonet/issues"

[project.optional-dependencies]
dev = [
    "pytest>=9.0",
    "black>=26.5",
    "ruff>=0.15",
    "mypy>=2.1"
]
test = [
    "pytest>=9.0",
]

docs = [
    "sphinx>=9.1,<10",
    "pydata-sphinx-theme>=0.21,<1",
    "numpydoc>=1.11,<2",
]

[tool.setuptools]
package-dir = {"" = "src"}
packages = {find = {where = ["src"]}}

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = ["-v", "--tb=short"]

[tool.mypy]
python_version = "3.12"
files = ["src", "tests"]
warn_return_any = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
ignore_missing_imports = true

[tool.black]
line-length = 120
target-version = ["py312", "py313", "py314"]
include = "\\.pyi?$"

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src"]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "W",
    "B",
    "I",
    "N",
    "C"
]
